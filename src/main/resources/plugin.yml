name: LobbySystem
version: 1.1.0
main: de.sujuc.lobby.LobbyPlugin
api-version: '1.21.10'
author: SujucDerBreite
description: Lobby, Cosmetics, Coins und signierte Lizenzen
commands:
  coins:
    description: Eigenen Kontostand anzeigen
    aliases: [balance]
  pay:
    description: Coins an einen anderen Spieler überweisen
    aliases: [ueberweisen]
  lobbytop:
    description: Coins- und Spielzeit-Ranglisten öffnen
    aliases: [top]
  profile:
    description: Eigenes Profil öffnen
    aliases: [profil]
  build:
    description: Baumodus umschalten
  lobbycoins:
    description: Coins verwalten
  setreward:
    description: Daily-Reward-Hexe setzen oder entfernen
  setsettings:
    description: Einstellungs-Dorfbewohner setzen oder entfernen
  setspawn:
    description: Spawn setzen
  setwarp:
    description: Warp setzen oder entfernen
  tpcoord:
    description: Zu Koordinaten teleportieren
  lobby:
    description: Zum Lobbyspawn
  navigator:
    description: Navigator öffnen
  cosmetics:
    description: Cosmetics öffnen
  settings:
    description: Einstellungen öffnen
  reward:
    description: Tägliche Belohnung öffnen
  lottery:
    description: Lottery öffnen
  lobbylicense:
    description: Lizenzstatus, Aktivierung und Owner-Verwaltung
